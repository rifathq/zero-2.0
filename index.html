<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        const origDefineProperty = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
          if (obj === window && prop === 'fetch') {
            let currentFetch = descriptor.get ? descriptor.get() : descriptor.value;
            return origDefineProperty.call(this, obj, prop, {
              configurable: true,
              enumerable: true,
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              }
            });
          }
          return origDefineProperty.apply(this, arguments);
        };
      })();
    </script>
